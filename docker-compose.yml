services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: semeando
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semeando}
      POSTGRES_DB: semeando
    ports:
      # 5433 no host para não conflitar com um PostgreSQL já instalado na máquina.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semeando -d semeando"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: prod
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://semeando:${POSTGRES_PASSWORD:-semeando}@db:5432/semeando
      SECRET_KEY: ${SECRET_KEY:-dev-secret-troque-em-producao-0123456789abcdef}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  portal-responsavel:
    build:
      context: ./portal-responsavel
      args:
        VITE_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"

  portal-aluno:
    build:
      context: ./portal-aluno
      args:
        VITE_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8082:80"

  portal-professor:
    build:
      context: ./portal-professor
      args:
        VITE_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8083:80"

  # Roda a suíte de testes do back-end contra o banco semeando_test:
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: dev
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://semeando:${POSTGRES_PASSWORD:-semeando}@db:5432/semeando_test
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "--cov=app", "--cov-fail-under=80"]

volumes:
  pgdata:
  uploads:
